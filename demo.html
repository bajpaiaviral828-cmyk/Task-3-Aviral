<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Generation Studio</title>
  <style>
    /* Glassmorphism Background */
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }

    /* Glass Container */
    .container { 
      max-width: 600px; 
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      color: white;
    }

    h1 { 
      text-align: center;
      margin-top: 0;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .input-group { 
      margin-bottom: 20px; 
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9em;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Glass Inputs */
    textarea { 
      width: 100%; 
      padding: 12px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; 
      box-sizing: border-box; 
      color: white;
      font-family: inherit;
      transition: all 0.3s ease;
      height: 100px; 
      resize: vertical;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    /* Vibrant Button */
    button { 
      width: 100%;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: white; 
      border: none; 
      padding: 14px 20px; 
      cursor: pointer; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
    }

    .result { 
      margin-top: 30px; 
      text-align: center; 
      min-height: 50px;
    }

    img { 
      max-width: 100%; 
      border-radius: 10px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .disclaimer { 
      font-size: 0.8em; 
      color: rgba(255, 255, 255, 0.6); 
      margin-top: 30px; 
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      padding-top: 15px; 
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Studio</h1>

  <div class="input-group">
    <label>What do you want to see?</label>
    <textarea id="prompt" placeholder="A futuristic city in the clouds, cyberpunk style, highly detailed..."></textarea>
  </div>
  
  <button onclick="generateImage()">Generate Image</button>

  <div class="result" id="resultArea">
    <!-- Image will appear here -->
  </div>

  <div class="disclaimer">
    <strong>Note:</strong> Because browsers strictly block Hugging Face API keys via CORS, this web demo uses a public image rendering endpoint to bypass browser security. To use your personal Hugging Face API key, run the <code>main.py</code> CLI tool locally!
  </div>
</div>

<script>
  function generateImage() {
    const prompt = document.getElementById('prompt').value;
    const resultArea = document.getElementById('resultArea');

    if (!prompt) {
      alert("Please enter a prompt.");
      return;
    }

    resultArea.innerHTML = "<p><em>Generating image... (bypassing CORS)</em></p>";

    // Using Pollinations.ai as a public endpoint because it natively supports browser-based image 
    // generation without CORS issues or preflight fetch errors!
    const encodedPrompt = encodeURIComponent(prompt);
    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&nologo=true`;

    // We can load it directly into an image tag, which completely bypasses the fetch() CORS policy!
    const img = new Image();
    img.onload = () => {
      resultArea.innerHTML = '';
      resultArea.appendChild(img);
    };
    img.onerror = () => {
      resultArea.innerHTML = `<p style="color:#ff6b6b">Failed to connect to the image server.</p>`;
    };
    img.src = imageUrl;
  }
</script>

</body>
</html>

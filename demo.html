<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Generation Studio</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    textarea { width: 100%; height: 80px; margin-bottom: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
    button { background-color: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-size: 16px; }
    button:hover { background-color: #218838; }
    .result { margin-top: 20px; text-align: center; }
    img { max-width: 100%; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .disclaimer { font-size: 0.8em; color: #666; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    .input-group { margin-bottom: 15px; }
    input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Studio</h1>
  
  <div class="input-group">
    <label>Hugging Face API Key:</label>
    <input type="password" id="apiKey" placeholder="hf_..." />
  </div>

  <div class="input-group">
    <label>What do you want to see?</label>
    <textarea id="prompt" placeholder="A futuristic city in the clouds, cyberpunk style..."></textarea>
  </div>
  
  <button onclick="generateImage()">Generate Image</button>

  <div class="result" id="resultArea">
    <!-- Image will appear here -->
  </div>

  <div class="disclaimer">
    <strong>Note:</strong> This frontend is for demonstration purposes. It calls the Hugging Face Inference API directly from your browser. In a real production app, API calls should be routed through a backend server to protect your key and handle the binary data streams more safely.
  </div>
</div>

<script>
  async function generateImage() {
    const apiKey = document.getElementById('apiKey').value;
    const prompt = document.getElementById('prompt').value;
    const resultArea = document.getElementById('resultArea');

    if (!apiKey || !prompt) {
      alert("Please enter both an API key and a prompt.");
      return;
    }

    resultArea.innerHTML = "<p>Generating image... this might take 10-30 seconds if the model is waking up.</p>";

    // Calling the free Hugging Face Stable Diffusion API
    const url = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0";
    
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: prompt })
      });

      if (!response.ok) {
        const err = await response.text();
        resultArea.innerHTML = `<p style="color:red">API Error: ${response.status} - ${err}</p>`;
        return;
      }

      // The API returns raw binary image data
      const blob = await response.blob();
      
      // Convert the binary blob into a URL the browser can display
      const imageUrl = URL.createObjectURL(blob);
      
      resultArea.innerHTML = `<img src="${imageUrl}" alt="Generated Image" />`;
      
    } catch (error) {
      resultArea.innerHTML = `<p style="color:red">Failed to connect: ${error.message}</p>`;
    }
  }
</script>

</body>
</html>

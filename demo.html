<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Generation Studio</title>
  <style>
    /* Glassmorphism Background */
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
    }

    /* Glass Container */
    .container { 
      max-width: 600px; 
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px; 
      border-radius: 20px; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      color: white;
    }

    h1 { 
      text-align: center;
      margin-top: 0;
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .input-group { 
      margin-bottom: 20px; 
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9em;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Glass Inputs */
    input[type="password"], textarea { 
      width: 100%; 
      padding: 12px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px; 
      box-sizing: border-box; 
      color: white;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    
    input[type="password"]::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input[type="password"]:focus, textarea:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    textarea { 
      height: 100px; 
      resize: vertical;
    }

    /* Vibrant Button */
    button { 
      width: 100%;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: white; 
      border: none; 
      padding: 14px 20px; 
      cursor: pointer; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: 600;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }

    button:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
    }

    .result { 
      margin-top: 30px; 
      text-align: center; 
      min-height: 50px;
    }

    img { 
      max-width: 100%; 
      border-radius: 10px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .disclaimer { 
      font-size: 0.8em; 
      color: rgba(255, 255, 255, 0.6); 
      margin-top: 30px; 
      border-top: 1px solid rgba(255, 255, 255, 0.1); 
      padding-top: 15px; 
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎨 AI Image Studio</h1>
  
  <div class="input-group">
    <label>Hugging Face API Key</label>
    <input type="password" id="apiKey" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxx" />
  </div>

  <div class="input-group">
    <label>What do you want to see?</label>
    <textarea id="prompt" placeholder="A futuristic city in the clouds, cyberpunk style, highly detailed..."></textarea>
  </div>
  
  <button onclick="generateImage()">Generate Image</button>

  <div class="result" id="resultArea">
    <!-- Image will appear here -->
  </div>

  <div class="disclaimer">
    <strong>Note:</strong> This frontend is for demonstration purposes. It calls the Hugging Face Inference API directly from your browser. In a real production app, API calls should be routed through a backend server to protect your key and handle the binary data streams more safely.
  </div>
</div>

<script>
  async function generateImage() {
    const apiKey = document.getElementById('apiKey').value;
    const prompt = document.getElementById('prompt').value;
    const resultArea = document.getElementById('resultArea');

    if (!apiKey || !prompt) {
      alert("Please enter both an API key and a prompt.");
      return;
    }

    resultArea.innerHTML = "<p><em>Generating image... this might take 10-30 seconds if the model is waking up.</em></p>";

    // Calling the free Hugging Face Stable Diffusion API directly
    const url = "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-xl-base-1.0";
    
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ inputs: prompt })
      });

      if (!response.ok) {
        const err = await response.text();
        resultArea.innerHTML = `<p style="color:#ff6b6b">API Error: ${response.status} - ${err}</p>`;
        return;
      }

      // The API returns raw binary image data
      const blob = await response.blob();
      
      // Convert the binary blob into a URL the browser can display
      const imageUrl = URL.createObjectURL(blob);
      
      resultArea.innerHTML = `<img src="${imageUrl}" alt="Generated Image" />`;
      
    } catch (error) {
      resultArea.innerHTML = `<p style="color:#ff6b6b">Failed to connect: ${error.message}</p>`;
    }
  }
</script>

</body>
</html>
